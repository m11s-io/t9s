name: Verify ToFu App Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-homebrew-tap-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create a read-only Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.TOFU_CLIENT_ID }}
          private-key: ${{ secrets.TOFU_APP_PRIVATE_KEY }}
          owner: m11s-io
          repositories: homebrew-tap
          permission-contents: read
          skip-token-revoke: false

      - name: Verify read access to Homebrew tap contents
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/m11s-io/homebrew-tap/contents --jq 'length'
