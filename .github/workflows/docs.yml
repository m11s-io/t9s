name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: docs
          runtime: node@26.13.1
          cache: true
          require-lockfile: true
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: pnpm run build

  deploy:
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-26.04
    environment: production
    concurrency:
      group: t9s-docs-production
      cancel-in-progress: true
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          working-directory: docs
          runtime: node@26.13.1
          cache: true
          require-lockfile: true
      - run: pnpm --dir docs run test
      - run: pnpm --dir docs run typecheck
      - run: pnpm --dir docs run build
      - name: Deploy to Cloudflare Pages
        working-directory: docs
        run: >-
          pnpm dlx --allow-build=esbuild --allow-build=workerd --allow-build=sharp wrangler@4.99.0 pages deploy dist
          --project-name=t9s
          --branch=main
          --commit-hash="${GITHUB_SHA}"
          --commit-message="${COMMIT_MESSAGE}"
      - name: Verify deployed commit
        run: |
          deployments="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/t9s/deployments")"
          jq --exit-status --arg sha "${GITHUB_SHA}" \
            '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha and .deployment_trigger.metadata.branch == "main")' \
            <<<"${deployments}"
      - name: Smoke test production
        run: >-
          curl --fail --silent --show-error
          --retry 12 --retry-delay 10 --retry-all-errors
          https://t9s.m11s.io/
