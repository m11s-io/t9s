# .goreleaser.yml
version: 2

project_name: t9s

before:
  hooks:
    - go mod download

builds:
  - id: t9s
    main: ./cmd/t9s
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/m11s-io/t9s/internal/version.Version={{.Version}}
      - -X github.com/m11s-io/t9s/internal/version.Commit={{.Commit}}
      - -X github.com/m11s-io/t9s/internal/version.Date={{.Date}}

archives:
  - name_template: "t9s_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.sha256"

homebrew_casks:
  - name: t9s
    repository:
      owner: m11s-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://t9s.m11s.io"
    description: "A resource-first terminal UI for Talos Linux clusters"
    binaries:
      - t9s

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Documentation
      regexp: '^docs(\(.+\))?!?:'
      order: 2
    - title: Chores
      regexp: '^chore(\(.+\))?!?:'
      order: 3
    - title: Other
      order: 999

release:
  prerelease: false
